spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://ep-empty-surf-axyon6ok-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:neondb_owner}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:${DB_PASSWORD:npg_KEC0HO5ruAUw}}}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
    locations: classpath:db/migration

cloudinary:
