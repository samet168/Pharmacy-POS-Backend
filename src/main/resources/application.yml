  api-key: ${CLOUDINARY_API_KEY:214689579787225}
  api-secret: ${CLOUDINARY_API_SECRET:iSMOjoiGU7zjAjCskUXELQHGU8o}

jwt:
  secret: ${JWT_SECRET:your-long-random-jwt-secret-key-change-this-in-production-at-least-32-characters-long}
  access-token-expiry-minutes: 30
  refresh-token-expiry-days: 14

server:
  port: ${PORT:8081}
  address: 0.0.0.0

springdoc:
  api-docs:
    path: /v3/api-docs
